<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Song - SpotiList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="edit-page-body">
    <div class="edit-container">
        <h1>Edit Song</h1>
        <img id="edit-art-preview" src="" alt="Album Art Preview" class="edit-preview-img">
        
        <form id="edit-song-form" class="styled-form edit-form-column">
            <label>Song Title</label>
            <input type="text" id="edit-song" required>
            <label>Artist</label>
            <input type="text" id="edit-artist" required>
            <label>Genre</label>
            <input type="text" id="edit-genre" required>
            <label>Album Art URL</label>
            <input type="text" id="edit-albumArt">
            <div class="edit-actions">
                <button type="submit" class="btn-primary">Save Changes</button>
                <a href="index.html" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
